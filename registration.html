<!DOCTYPE html>
<html>
<head>
<title>Registration Form</title>

<style>
body{
    background:#d6eaf8;
    font-family:Arial;
}
form{
    width:300px;
    margin:80px auto;
    padding:20px;
    background:white;
    border-radius:10px;
    text-align:center;
}
input{
    width:95%;
    padding:8px;
    margin:8px 0;
}
input[type="submit"]{
    background:green;
    color:white;
}
input[type="reset"]{
    background:red;
    color:white;
}
textarea{
    width:95%;
    padding:8px;
    margin:8px 0;
}
</style>

</head>
<body>

<form>
<h2 style="color:blue;">Registration Form</h2>

<input type="text" placeholder="Roll Number" required>
<input type="text" placeholder="Name" required>
<input type="password" placeholder="Password" required>
<input type="email" placeholder="Email" required>
<input type="tel" placeholder="Phone Number" required>
<label>Address</label><br>
<label>Address</label><br>
<textarea rows="4" cols="30" placeholder="Enter Address"></textarea>
<input type="submit" value="Register">
<input type="reset" value="Reset">

</form>

</body>
</html>
